<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>500 — Ошибка сервера | Lab Review</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
	<style>
		*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
		:root {
			--bg: #0a0a0a;
			--bg-3: #161616;
			--accent: #e8382a;
			--muted: rgba(255,255,255,0.52);
		}
		html, body {
			height: 100%;
			background: var(--bg);
			color: #fff;
			font-family: 'Manrope', Arial, sans-serif;
		}
		a { text-decoration: none; color: inherit; }

		.error-page {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 40px 20px;
		}
		.error-inner {
			text-align: center;
			max-width: 540px;
		}
		.error-code {
			font-size: clamp(96px, 16vw, 200px);
			font-weight: 900;
			line-height: 1;
			letter-spacing: -0.05em;
			color: var(--bg-3);
		}
		.error-code::after {
			content: '';
			display: block;
			width: 60px;
			height: 4px;
			background: var(--accent);
			margin: 16px auto 32px;
			border-radius: 2px;
		}
		.error-title {
			font-size: clamp(22px, 3vw, 32px);
			font-weight: 800;
			letter-spacing: -0.03em;
			margin-bottom: 16px;
		}
		.error-text {
			font-size: 16px;
			line-height: 1.6;
			color: var(--muted);
			margin-bottom: 40px;
		}
		.error-btn {
			display: inline-flex;
			align-items: center;
			height: 52px;
			padding: 0 32px;
			border-radius: 999px;
			background: var(--accent);
			color: #fff;
			font-size: 15px;
			font-weight: 700;
			transition: opacity .2s;
		}
		.error-btn:hover { opacity: 0.88; }
	</style>
</head>
<body>
	<div class="error-page">
		<div class="error-inner">
			<div class="error-code">500</div>
			<h1 class="error-title">Ошибка сервера</h1>
			<p class="error-text">Что-то пошло не так на нашей стороне. Мы уже разбираемся. Попробуйте обновить страницу или вернитесь чуть позже.</p>
			<a href="/" class="error-btn">На главную</a>
		</div>
	</div>
</body>
</html>
